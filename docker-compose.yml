# docker-compose.yml
#
# Two services: backend (FastAPI + OCR + LLM verification) and frontend
# (React + TypeScript, served via Vite dev server for demo).
#
# The SQLite database lives on a named Docker volume (backend_db_data)
# at /app/db_data/app.db so it survives `docker-compose down && up`
# cycles. Seed data (reviewer/admin accounts, synthetic verification
# sources) is written only when the database is empty — restarting
# the stack never wipes accounts or uploaded documents.
#
# Usage:
#   1. Ensure backend/.env has real values (JWT_SECRET_KEY, LLM_API_KEY)
#   2. docker-compose up --build
#   3. Frontend: http://localhost:5173  |  Backend: http://localhost:8000
#   4. To fully reset: docker-compose down -v && docker-compose up --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DB_DATA_DIR=/app/db_data
      - DATABASE_URL=sqlite:////app/db_data/app.db
    volumes:
      - backend_db_data:/app/db_data
      - backend_uploads:/app/uploaded_documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_db_data:
    driver: local
  backend_uploads:
    driver: local
